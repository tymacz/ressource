name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ressource

env:
  DATABASE_URL: postgresql://admin:password123@localhost:5432/ressource_db
  # schema.prisma declares directUrl for the pooled-connection setup used in
  # real environments (Supabase). There is no pooler locally/in CI, so this
  # just points at the same ephemeral service Postgres as DATABASE_URL.
  # NEVER put a real DIRECT_URL value here -- use a repository secret instead.
  DIRECT_URL: postgresql://admin:password123@localhost:5432/ressource_db
  # CI-only value, never used outside this ephemeral runner. Real
  # environments get their own secret via the hosting platform.
  BETTER_AUTH_SECRET: ci-only-secret-never-used-outside-github-actions-runners
  BETTER_AUTH_URL: http://localhost:3000

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: ressource_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ressource/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync database schema
        run: pnpm exec prisma db push

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Performance check (Lighthouse CI)
        run: |
          pnpm start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && break
            sleep 1
          done
          pnpm dlx @lhci/cli@0.14.x autorun --config=./lighthouserc.json
          kill "$SERVER_PID" 2>/dev/null || true

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: ressource/.lighthouseci
          retention-days: 14
          if-no-files-found: ignore

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy - dependency vulnerabilities (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ressource
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

      - name: Trivy - dependency vulnerabilities (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ressource
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: sarif
          output: trivy-vuln.sarif

      - name: Trivy - secrets and misconfiguration (report only)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ressource
          scanners: secret,misconfig
          exit-code: "0"
          format: sarif
          output: trivy-secret-misconfig.sarif

      - name: Upload vulnerability report to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-vuln.sarif
          category: trivy-vuln

      - name: Upload secrets/misconfig report to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-secret-misconfig.sarif
          category: trivy-secret-misconfig

  release:
    needs: [build-and-test, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ressource/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release (semantic-release)
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
